name: a50 bare make config check

# docs/kernel.md step (a): does a bare `make halium_a50_defconfig` (how the
# UBports tools configure) reproduce the tested build .config? Config only.
on:
  push:
    branches: [halium-a50-config]

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch the tested tree and the Kconfig dependency fix
        run: |
          set -euo pipefail
          git init -q k && cd k
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin halium-a50-aa17rf2
          git checkout -q FETCH_HEAD
          git fetch -q --depth 2 origin d159cfba9856a82aa4338398f28f04df95e1acb1 57ba2d49609515647dd5300e154da5402b90fcfe
          git -c user.name=x -c user.email=x@x cherry-pick 57ba2d49609515647dd5300e154da5402b90fcfe
          git log -1 --oneline HEAD
      - name: savedefconfig with the vendor environment, then bare expansion
        run: |
          set -euo pipefail
          cd k
          sudo apt-get -qq install -y flex bison >/dev/null
          norm() { grep -v '^#' "$1" | grep . | sort; }
          cp arch/arm64/configs/halium_a50_defconfig /tmp/tested.config
          cp /tmp/tested.config .config
          ls -la KernelSU drivers/kernelsu 2>&1 | head -4 || true
          ANDROID_MAJOR_VERSION=r PLATFORM_VERSION=11.0.0 make ARCH=arm64 olddefconfig savedefconfig 2>&1 | grep -vE "dangling|cv_stack|check_top|zconf|inlined|In function|^ +[0-9]* [|]|^ +[|]" | tail -20
          echo "== vendor-env olddefconfig vs tested"; diff <(norm /tmp/tested.config) <(norm .config) || true
          wc -l defconfig; cp defconfig /tmp/halium_a50_defconfig
          bare() { cp /tmp/halium_a50_defconfig arch/arm64/configs/halium_a50_defconfig; rm -f .config; env -u ANDROID_MAJOR_VERSION -u PLATFORM_VERSION make ARCH=arm64 halium_a50_defconfig >/dev/null; echo "== bare ($1) vs tested"; diff <(norm /tmp/tested.config) <(norm .config) || true; }
          bare plain
          git checkout -q -- arch/arm64/configs/halium_a50_defconfig
          git -c user.name=x -c user.email=x@x cherry-pick d159cfba9856a82aa4338398f28f04df95e1acb1
          bare with-d159cfba
