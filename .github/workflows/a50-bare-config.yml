name: a50 bare make config check

# docs/kernel.md step (a): does a bare `make halium_a50_defconfig` (how the
# UBports tools configure) reproduce the tested build .config? Config only.
on:
  push:
    branches: [halium-a50-config]

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch the tested tree and the Kconfig dependency fix
        run: |
          set -euo pipefail
          git init -q k && cd k
          git remote add origin "https://github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin halium-a50-aa17rf2
          git checkout -q FETCH_HEAD
          git fetch -q --depth 2 origin d159cfba98568fe62bd29c2ec20cb31f8bca8836
          git log -1 --oneline HEAD
      - name: Bare config, with and without the dependency fix
        run: |
          set -euo pipefail
          cd k
          sudo apt-get -qq install -y flex bison >/dev/null
          cp arch/arm64/configs/halium_a50_defconfig /tmp/tested.config
          run() { make -s ARCH=arm64 halium_a50_defconfig >/dev/null; grep -v '^#' .config | grep . | sort > "/tmp/$1"; }
          diff_report() { echo "== $1"; diff <(grep -v '^#' /tmp/tested.config | grep . | sort) "/tmp/$1" || true; }
          run plain.config; diff_report plain.config
          git -c user.name=x -c user.email=x@x cherry-pick -X theirs d159cfba98568fe62bd29c2ec20cb31f8bca8836 >/dev/null 2>&1 || { git cherry-pick --abort; echo "cherry-pick failed"; exit 1; }
          run fixed.config; diff_report fixed.config
